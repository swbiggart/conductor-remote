# XcodeGen spec — the .xcodeproj is generated, never committed:
#   brew install xcodegen && cd ios && xcodegen generate
# Simulator builds need no signing. For a device build, run `yarn ios:deploy`
# (repo root) — it resolves your personal team into the gitignored
# Signing.local.xcconfig and builds/installs onto a connected iPhone.
name: ConductorRemote
options:
  bundleIdPrefix: com.biggart
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Signing.xcconfig is committed and #include?s the gitignored personal
# Signing.local.xcconfig (written by `yarn ios:deploy`) — xcodebuild errors out
# on a missing baseConfiguration file, so the wired file must always exist.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  ConductorKit:
    path: ConductorKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # DEVELOPMENT_TEAM lives only in Signing.local.xcconfig — a value here would
    # outrank the xcconfig and mask it.
    CODE_SIGN_STYLE: Automatic
schemes:
  ConductorRemote:
    build:
      targets:
        ConductorRemote: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  ConductorRemote:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: ConductorKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Conductor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: >-
          The camera scans the pairing QR code shown by the relay on your Mac.
        NSAppTransportSecurity:
          # The relay is HTTPS via Tailscale in normal use; the loopback
          # exception exists for simulator runs against 127.0.0.1:8787.
          NSAllowsLocalNetworking: true
